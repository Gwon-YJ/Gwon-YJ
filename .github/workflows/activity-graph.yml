name: Generate Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity.svg
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: gwonyj91
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: activity.svg
          options: theme=github&hide_border=true

      - name: Commit activity.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity.svg

          if git diff --cached --quiet; then
            echo "No changes to activity.svg"
          else
            git commit -m "chore: update activity graph"
            git push
          fi
